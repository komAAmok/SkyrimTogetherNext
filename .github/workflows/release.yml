name: Release build

# Builds the client/server on a Windows runner and publishes two separate
# zips as a GitHub Release when a tag is pushed:
#   SkyrimTogetherNextMod-<version>.zip    -> the client mod (MO2 installable,
#                                             FOMOD guided installer, optional
#                                             companion plugins inside)
#   SkyrimTogetherNextServer-<version>.zip -> the dedicated server (windowed
#                                             control panel on Windows)
# Can also be triggered manually (workflow_dispatch); the zips are then
# uploaded as workflow artifacts instead.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    uses: ./.github/workflows/windows.yml
    with:
      build-mode: 'release'
      upload-build-for-next-job: true

  package:
    runs-on: windows-latest
    needs: build-windows
    permissions:
      contents: write
    steps:
      - name: Download build and game files
        uses: actions/download-artifact@v5
        with:
          name: internal-job-files

      - name: Download plugin artifacts
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: plugin-artifacts
          path: plugin-artifacts

      - name: Assemble the mod package
        shell: pwsh
        run: |
          # The zip root mirrors the game's Data folder (SKSE/, scripts/, meshes/,
          # SkyrimTogether.esp, SkyrimTogetherRebornBehaviors/, SkyrimTogetherRuntime/),
          # so a DIRECT install - when MO2 does not run the FOMOD wizard (replace
          # installs, older MO2) or the user extracts the archive by hand - is
          # already correct. fomod/ holds the wizard; the optional folders
          # (VerifyScript/, launcher/, OptionalPlugins/) sit at the root as well.
          #
          # The assembly itself lives in Tools/Packaging so the same code path can
          # be dry-run locally; it also verifies the wizard against the staged tree
          # before zipping, so a wizard entry pointing at nothing fails the build.
          $ver = "${{ needs.build-windows.outputs.str-version }}"
          $args = @{
            Stage = 'mod-pack'
            Dist = '.'
            BuildDir = 'build/windows/x64/release'
            Version = $ver
          }
          if (Test-Path 'plugin-artifacts') { $args['ArtifactsRoot'] = 'plugin-artifacts' }
          & Tools/Packaging/New-STNModPackage.ps1 @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble the server package
        shell: pwsh
        run: |
          # ---- dedicated server (SkyrimTogetherNextServer-<version>.zip) ----
          # The mod step left the server binaries in the build directory on purpose;
          # copy them plus the shared runtime dlls so the server stays self contained.
          New-Item -ItemType Directory -Force -Path server-pack | Out-Null
          Get-ChildItem build/windows/x64/release -Filter SkyrimTogetherServer.exe |
            ForEach-Object { Copy-Item $_.FullName server-pack/ -Force }
          Get-ChildItem build/windows/x64/release -Filter STServer.dll |
            ForEach-Object { Copy-Item $_.FullName server-pack/ -Force }
          Copy-Item mod-pack/SkyrimTogetherRuntime/*.dll server-pack/ -Exclude SkyrimTogetherRuntime*.dll -ErrorAction SilentlyContinue
          if (!(Test-Path server-pack/SkyrimTogetherServer.exe)) { throw 'server package is missing SkyrimTogetherServer.exe' }
          # a starter readme so hosts know how to configure and run it
          Set-Content server-pack/README.txt "Skyrim Together Next - dedicated server`n`nRun SkyrimTogetherServer.exe to start (a small control panel window opens).`n`n- Press Stop or close the window to shut the server down.`n- Edit config\STServer.ini (button in the window) to change port,`n  passwords, player limits and the mod policy.`n- Default port: UDP 10578 - remember to allow it in your firewall.`n- Add --nogui as a command line argument for the classic terminal mode.`n`nPlayers connect from the in-game menu (F2) to <this machine's ip>:10578.`nLAN/VPN play needs no further setup - see docs/LAN-RADMIN-GUIDE.md."
          # a starter readme so hosts know how to configure and run it

      - name: Create the server zip
        shell: pwsh
        run: |
          # The mod package was already written by Tools/Packaging/New-STNModPackage.ps1,
          # which owns its archive name and contents; only the server is zipped here.
          $ver = "${{ needs.build-windows.outputs.str-version }}"
          Compress-Archive -Path server-pack/* -DestinationPath "SkyrimTogetherNextServer-$ver.zip"
          if (!(Test-Path "SkyrimTogetherNextMod-$ver.zip")) {
            throw "mod package SkyrimTogetherNextMod-$ver.zip was not produced"
          }
          Get-ChildItem *.zip | Select-Object Name, Length
      - name: Upload as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Skyrim Together Next Release ${{ needs.build-windows.outputs.str-version }}
          path: |
            SkyrimTogetherNextMod-*.zip
            SkyrimTogetherNextServer-*.zip

      - name: Publish GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SkyrimTogetherNextMod-*.zip
            SkyrimTogetherNextServer-*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
