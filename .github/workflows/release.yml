name: Release build

# Builds the client/server on a Windows runner and publishes two separate
# zips as a GitHub Release when a tag is pushed:
#   SkyrimTogetherNextMod-<version>.zip    -> the client mod (MO2 installable,
#                                             FOMOD guided installer)
#   SkyrimTogetherNextServer-<version>.zip -> the dedicated server (windowed
#                                             control panel on Windows)
# Can also be triggered manually (workflow_dispatch); the zips are then
# uploaded as workflow artifacts instead.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    uses: ./.github/workflows/windows.yml
    with:
      build-mode: 'release'
      upload-build-for-next-job: true

  package:
    runs-on: windows-latest
    needs: build-windows
    permissions:
      contents: write
    steps:
      - name: Download build and game files
        uses: actions/download-artifact@v5
        with:
          name: internal-job-files

      - name: Assemble the mod package layout
        run: |
          # ---- client mod (SkyrimTogetherNextMod-<version>.zip) ----
          # FOMOD layout: fomod/ holds the wizard, "Core" and "LegacySE" are
          # the option directories the wizard picks from; everything maps
          # straight into the game's Data folder.
          mkdir -p mod-pack/fomod mod-pack/Core mod-pack/LegacySE
          Copy-Item -Recurse GameFiles/Skyrim/fomod/* mod-pack/fomod/
          # Core: everything except the fomod wizard itself and the legacy
          # libraries (those are a wizard option)
          Copy-Item -Recurse GameFiles/Skyrim/* mod-pack/Core/
          Remove-Item -Recurse -Force mod-pack/Core/fomod -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force mod-pack/Core/SKSE/Plugins/version-*.bin -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force mod-pack/Core/SKSE/Plugins/versionlib-ae-to-se-*.map -ErrorAction SilentlyContinue
          # LegacySE: pre-AE address libraries + the AE-to-SE maps
          Copy-Item -Recurse GameFiles/Skyrim/SKSE/Plugins/version-*.bin mod-pack/LegacySE/ -ErrorAction SilentlyContinue
          Copy-Item -Recurse GameFiles/Skyrim/SKSE/Plugins/versionlib-ae-to-se-*.map mod-pack/LegacySE/ -ErrorAction SilentlyContinue
          # SKSE bootstrap plugin; on load it deploys the runtime payload
          # from Data/SkyrimTogetherRuntime/ into the game root
          mkdir -p mod-pack/Core/SKSE/Plugins
          Move-Item build/windows/x64/release/SkyrimTogetherSKSE.dll mod-pack/Core/SKSE/Plugins/
          # self deploying runtime payload: everything the client needs at
          # the game root (client dll, cef runtime + locales, tp_process,
          # UI assets). only the launcher/server binaries and build
          # byproducts are held back
          mkdir -p mod-pack/Core/SkyrimTogetherRuntime mod-pack/launcher server-pack
          Move-Item build/windows/x64/release/SkyrimTogether.exe build/windows/x64/release/EarlyLoad.dll mod-pack/launcher/ -ErrorAction SilentlyContinue
          Move-Item build/windows/x64/release/SkyrimTogetherServer.exe build/windows/x64/release/STServer.dll server-pack/ -ErrorAction SilentlyContinue
          Get-ChildItem build/windows/x64/release -Exclude *.pdb,*.lib,*.exp,*Tests.exe |
            Move-Item -Destination mod-pack/Core/SkyrimTogetherRuntime/
          New-Item -ItemType File -Path mod-pack/Core/SkyrimTogetherRuntime/.str_version | Out-Null

      - name: Assemble the server package layout
        run: |
          # ---- dedicated server (SkyrimTogetherNextServer-<version>.zip) ----
          # NOTE: the server binaries were already moved out of the build
          # dir by the mod step; add copies of the shared runtime dlls so
          # the server stays self contained
          mkdir -p server-pack
          Copy-Item mod-pack/Core/SkyrimTogetherRuntime/*.dll server-pack/ -ErrorAction SilentlyContinue
          # a starter readme so hosts know how to configure and run it
          Set-Content server-pack/README.txt "Skyrim Together Next - dedicated server`n`nRun SkyrimTogetherServer.exe to start (a small control panel window opens).`n`n- Press Stop or close the window to shut the server down.`n- Edit config\STServer.ini (button in the window) to change port,`n  passwords, player limits and the mod policy.`n- Default port: UDP 10578 - remember to allow it in your firewall.`n- Add --nogui as a command line argument for the classic terminal mode.`n`nPlayers connect from the in-game menu (F2) to <this machine's ip>:10578.`nLAN/VPN play needs no further setup - see docs/LAN-RADMIN-GUIDE.md."

      - name: Create the release zips
        run: |
          $ver = "${{ needs.build-windows.outputs.str-version }}"
          Compress-Archive -Path mod-pack/* -DestinationPath "SkyrimTogetherNextMod-$ver.zip"
          Compress-Archive -Path server-pack/* -DestinationPath "SkyrimTogetherNextServer-$ver.zip"

      - name: Upload as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Skyrim Together Next Release ${{ needs.build-windows.outputs.str-version }}
          path: |
            SkyrimTogetherNextMod-*.zip
            SkyrimTogetherNextServer-*.zip

      - name: Publish GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SkyrimTogetherNextMod-*.zip
            SkyrimTogetherNextServer-*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
