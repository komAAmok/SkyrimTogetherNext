name: Playable Skyrim Together Build

on:
  workflow_dispatch:
  schedule:
    # Every Friday at 1:00 p.m. UTC
    - cron: '0 13 * * 5'
  push:
    branches:
      - main
      - dev
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-.*)?'

jobs:
  build-windows:
    if: ${{ github.repository_owner == 'tiltedphoques' || github.event_name != 'schedule' }} # Disable cron runs in forks
    uses: ./.github/workflows/windows.yml
    with:
      build-mode: 'release'
      upload-build-for-next-job: true

  package-and-upload:
    runs-on: windows-latest
    needs: build-windows
    steps:
      - name: Download artifact from the previous job
        uses: actions/download-artifact@v5
        with:
          name: internal-job-files

      - name: Package build and organize directories
        run: |
          mkdir -p str-build/SkyrimTogetherReborn
          mv build/windows/x64/release/* str-build/SkyrimTogetherReborn
          cp -r GameFiles/Skyrim/* str-build/
          # SKSE bootstrap plugin goes into Data/SKSE/Plugins; on load it
          # deploys the runtime payload from Data/SkyrimTogetherRuntime/
          # into the game root (self installing SKSE launch path)
          mkdir -p str-build/SKSE/Plugins
          mv str-build/SkyrimTogetherReborn/SkyrimTogetherSKSE.dll str-build/SKSE/Plugins/
          # everything the client needs at runtime travels in the payload dir;
          # the launcher exe and server stay in SkyrimTogetherReborn for the
          # manual install path
          mkdir -p str-build/SkyrimTogetherRuntime
          Move-Item str-build/SkyrimTogetherReborn/SkyrimTogether.dll str-build/SkyrimTogetherRuntime/
          Move-Item str-build/SkyrimTogetherReborn/UI str-build/SkyrimTogetherRuntime/UI -ErrorAction SilentlyContinue
          Move-Item str-build/SkyrimTogetherReborn/bin str-build/SkyrimTogetherRuntime/bin -ErrorAction SilentlyContinue
          New-Item -ItemType File -Path str-build/SkyrimTogetherRuntime/.str_version | Out-Null

      - name: Remove unnecessary build files, keep .pdb
        run: |
          mkdir str-pdb
          mv str-build/SkyrimTogetherReborn/SkyrimTogether.pdb, str-build/SkyrimTogetherReborn/SkyrimTogetherServer.pdb str-pdb
          rm str-build/SkyrimTogetherReborn/*.pdb, str-build/SkyrimTogetherReborn/*.lib, str-build/SkyrimTogetherReborn/*.exp
          rm str-build/SkyrimTogetherReborn/*Tests.exe

      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: Skyrim Together Build (${{ needs.build-windows.outputs.str-version }})
          path: str-build/

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: Debug Symbols (${{ needs.build-windows.outputs.str-version }})
          path: str-pdb/
