name: Build windows

on:
  pull_request:
  push:
    branches:
      - main
      - prerel
  workflow_call:
    inputs:
      build-mode:
        required: true
        type: string
        default: 'releasedbg'
      upload-build-for-next-job:
        required: true
        type: boolean
        default: false
    outputs:
      str-version:
        description: "Skyrim Together version string"
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    strategy:
      matrix:
        os: [windows-2022]
        arch: [x64]

    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, 'ci skip')"

    outputs:
      version: ${{ steps.output-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          # We need full history in order to create a version string (BuildInfo.h)
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive --depth=1

      - name: Verify GitHub-hosted runner
        shell: pwsh
        run: |
          Write-Host "Runner name: $env:RUNNER_NAME"
          Write-Host "Runner environment: ${{ runner.environment }}"
          if ("${{ runner.environment }}" -ne "github-hosted") {
            Write-Error "Self-hosted runner detected. Please use the GitHub-hosted windows-latest runner."
          }

      - name: Checkout main on tag push
        if: github.ref_type == 'tag'
        # Checkout only if the tag was pushed to main; repos without a main
        # branch build the tagged commit directly
        run: |
          git rev-parse --verify --quiet origin/main
          if ($LASTEXITCODE -eq 0) {
            (git rev-parse HEAD) -eq (git rev-parse origin/main) -and (git checkout main)
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            Write-Output "origin/main not found; building the tagged commit as-is"
            exit 0
          }

      # Must come before the plugin builds: vcpkg resolves the x64-windows
      # triplet through Visual Studio and refuses to configure without one.
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # Companion plugins are CMake + vcpkg projects, pinned as submodules. The
      # step is skipped, not failed, when a fork drops the submodules: the
      # framework still builds, and packaging then fails loudly on the missing
      # plugin payload rather than shipping a wizard option that installs nothing.
      - name: Check companion plugin submodules
        id: plugins
        shell: pwsh
        run: |
          $ids = (Get-Content Code/plugins/plugins.json -Raw | ConvertFrom-Json).plugins.id
          $missing = @($ids | Where-Object { -not (Test-Path "plugins/$_/CMakeLists.txt") })
          if ($missing.Count -gt 0) {
            Write-Host "::warning::companion plugin submodules not checked out: $($missing -join ', ')"
            "present=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "companion plugins present: $($ids -join ', ')"
            "present=true" >> $env:GITHUB_OUTPUT
          }

      # vcpkg is not installed on the runner and the plugin projects need it, so
      # it is checked out here rather than assumed. The cache key covers the
      # bootstrap commit and the manifests: commonlibsse-ng comes from a
      # third-party registry and is compiled from source on a cold cache, which
      # is the difference between a few minutes and most of an hour.
      - name: Cache vcpkg
        if: steps.plugins.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.vcpkg/downloads
            ${{ github.workspace }}/.vcpkg-cache/binary
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('plugins/*/vcpkg.json', 'plugins/*/vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Set up vcpkg
        if: steps.plugins.outputs.present == 'true'
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:GITHUB_WORKSPACE '.vcpkg'
          if (Test-Path $vcpkg) {
            Write-Host "vcpkg restored from cache: $vcpkg"
          } else {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkg
            if ($LASTEXITCODE -ne 0) { throw 'vcpkg clone failed' }
          }
          & "$vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          if (!(Test-Path "$vcpkg/scripts/buildsystems/vcpkg.cmake")) {
            throw "vcpkg toolchain missing at $vcpkg/scripts/buildsystems/vcpkg.cmake"
          }
          # vcpkg aborts when VCPKG_DEFAULT_BINARY_CACHE names a directory that
          # does not exist, and on a cold cache key the cache action restores
          # nothing - so the directory is created here rather than assumed.
          $binaryCache = Join-Path $env:GITHUB_WORKSPACE '.vcpkg-cache/binary'
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null

          "VCPKG_ROOT=$vcpkg" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$binaryCache" >> $env:GITHUB_ENV
          Write-Host "VCPKG_ROOT=$vcpkg"
          Write-Host "VCPKG_DEFAULT_BINARY_CACHE=$binaryCache"

      # STRPM is built first: it is small, it fails fast if the interface header
      # and the bridge do not compile, and the consumers below link against the
      # ABI it defines.
      - name: Build STRPluginMessagingAPI
        if: steps.plugins.outputs.present == 'true'
        shell: pwsh
        run: |
          cmake -S plugins/STRPluginMessagingAPI -B plugins/STRPluginMessagingAPI/build -A x64 -DSTRPM_ENABLE_UDP_BACKEND=OFF -DSTRPM_BUILD_STR180_BRIDGE_PROBE=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build plugins/STRPluginMessagingAPI/build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The three consumers share the vcpkg toolchain and the STRPM headers.
      # They are otherwise independent: one failing consumer must not hide the
      # state of the others, so each is built and reported, and the job fails
      # once at the end if any of them did not build.
      - name: Build companion plugins
        if: steps.plugins.outputs.present == 'true'
        shell: pwsh
        run: |
          # VCPKG_ROOT and VCPKG_DEFAULT_BINARY_CACHE both come from the setup
          # step through GITHUB_ENV, so there is one place that defines them.
          if (-not $env:VCPKG_ROOT) { throw 'VCPKG_ROOT is not set; the vcpkg setup step did not run' }
          if (-not (Test-Path $env:VCPKG_DEFAULT_BINARY_CACHE)) { throw "binary cache dir missing: $env:VCPKG_DEFAULT_BINARY_CACHE" }

          $specs = @(
            @{ Id = 'OStimTogether';     Dir = 'plugins/OStimTogether' },
            @{ Id = 'MorphSyncTogether'; Dir = 'plugins/MorphSyncTogether' },
            @{ Id = 'IEDSyncTogether';   Dir = 'plugins/IEDSyncTogether' }
          )
          $failed = @()
          foreach ($spec in $specs) {
            Write-Host "::group::Build $($spec.Id)"
            # A consumer that vendors its own copy of the interface header is
            # compiled against the authoritative one instead. That is what
            # makes the STRPM contract enforceable rather than advisory.
            $vendored = Get-ChildItem -Path $spec.Dir -Recurse -Filter 'STRPluginMessagingAPI.h' -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\build\\' } | Select-Object -First 1
            if ($vendored) {
              Copy-Item 'Code/plugins/STRPM/include/STRPluginMessagingAPI/STRPluginMessagingAPI.h' $vendored.FullName -Force
              Write-Host "pinned vendored header: $($vendored.FullName)"
            }

            $toolchain = "$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

            # The configure output is captured so a failure can be reported as a
            # GitHub annotation. Annotations are readable without signing in,
            # and the step log is not, so a bare "configure failed" would leave
            # the actual reason visible only to whoever has an account.
            $configureLog = & cmake -S $spec.Dir -B "$($spec.Dir)/build" -A x64 -DCMAKE_TOOLCHAIN_FILE=$toolchain 2>&1
            $configureCode = $LASTEXITCODE
            $configureLog | ForEach-Object { Write-Host $_ }
            if ($configureCode -ne 0) {
              $tail = ($configureLog | Where-Object { $_ -match 'error|Error|CMake Error|not found|Could not|Unable' } | Select-Object -Last 6)
              if (-not $tail) { $tail = ($configureLog | Select-Object -Last 6) }
              $detail = ($tail -join ' | ') -replace '%', '%25' -replace '\r', '' -replace '\n', '%0A'
              Write-Host "::error title=$($spec.Id) configure failed::$detail"
              $failed += "$($spec.Id) (configure)"
              Write-Host "::endgroup::"
              continue
            }

            $buildLog = & cmake --build "$($spec.Dir)/build" --config Release --parallel 2>&1
            $buildCode = $LASTEXITCODE
            $buildLog | ForEach-Object { Write-Host $_ }
            if ($buildCode -ne 0) {
              $tail = ($buildLog | Where-Object { $_ -match 'error|Error' } | Select-Object -Last 6)
              if (-not $tail) { $tail = ($buildLog | Select-Object -Last 6) }
              $detail = ($tail -join ' | ') -replace '%', '%25' -replace '\r', '' -replace '\n', '%0A'
              Write-Host "::error title=$($spec.Id) build failed::$detail"
              $failed += "$($spec.Id) (build)"
            }

            Write-Host "::endgroup::"
          }

          if ($failed.Count -gt 0) {
            Write-Host "::error::companion plugin build failed: $($failed -join ', ')"
            exit 1
          }

      # Flattens each plugin's own build tree into <out>/<pluginId>/ so the
      # packaging script finds artifacts without knowing each project's output
      # directory convention.
      - name: Collect plugin artifacts
        if: steps.plugins.outputs.present == 'true'
        shell: pwsh
        run: |
          $root = 'plugin-artifacts'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          foreach ($id in (Get-Content Code/plugins/plugins.json -Raw | ConvertFrom-Json).plugins.id) {
            $from = "plugins/$id/build"
            if (-not (Test-Path $from)) { Write-Host "  $id : no build tree"; continue }
            New-Item -ItemType Directory -Force -Path "$root/$id" | Out-Null
            Get-ChildItem $from -Recurse -File -Include *.dll,*.pex,*.esp |
              Where-Object { $_.FullName -notmatch '\\CMakeFiles\\' } |
              ForEach-Object { Copy-Item $_.FullName "$root/$id/" -Force }
            Write-Host "  $id : $((Get-ChildItem "$root/$id" -File).Count) artifact(s)"
          }

      - name: Upload plugin artifacts
        if: steps.plugins.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plugin-artifacts
          path: plugin-artifacts/**
      - name: Cache xmake dependencies
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake/packages
          key: ${{ runner.os }}-xmake-${{ hashFiles('**/xmake.lua') }}
          # Fall back to the last warm package cache when the key changes
          # (e.g. an unrelated xmake.lua edit), so tiltedcore + friends are
          # reused instead of a fresh fetch/build that can flake.
          restore-keys: |
            ${{ runner.os }}-xmake-

      # Install xmake
      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.1.0
          actions-cache-folder: '.xmake-cache' # This doesn't cache dependencies, only xmake itself
          actions-cache-key: ${{ matrix.os }}

      - name: Point xmake to Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -property installationPath
            Write-Host "Visual Studio found: $vsPath"
            xmake g --vs="$vsPath"
          } else {
            Write-Error "vswhere.exe not found - Visual Studio is not installed on this runner"
          }

      - name: Configure xmake and install dependencies
        run: xmake config --arch=${{ matrix.arch }} --mode=${{ inputs.build-mode }} --toolchain=msvc --yes -vD

      - name: Show run identity
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== HEAD: $(git rev-parse HEAD) ==="
          Write-Host "=== tiltedcore requirement ==="
          Select-String -Path xmake.lua -Pattern 'tiltedcore'


      # Build the client
      - name: Build with xmake
        run: |
          xmake -y
          echo "STR_BUILD_DIR=build/windows/${{ matrix.arch }}/${{ inputs.build-mode }}/" >> $env:GITHUB_ENV

      # The 1.5.x runtime is a second client DLL built from the same sources
      # with the legacy struct layouts. It is built explicitly (Build.bat does
      # the same) and then checked, because a package without it leaves 1.5.x
      # players with a game that starts and never opens the multiplayer menu.
      - name: Build the legacy 1.5.x client runtime
        run: |
          xmake build SkyrimTogetherClientDllLegacy
          foreach ($dll in 'SkyrimTogetherRuntime.dll','SkyrimTogetherRuntime_1_5.dll') {
            $path = Join-Path $env:STR_BUILD_DIR $dll
            if (!(Test-Path $path)) { throw "$dll was not produced by the build" }
            Write-Host "$dll $((Get-Item $path).Length) bytes"
          }

      # Create distrib
      - name: Output distrib binaries via xmake
        run: |
          xmake install -o distrib
          cp -Force -Recurse distrib/bin/* ${{ env.STR_BUILD_DIR }}

      # Building the Together UI

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/iron
          cache-dependency-path: Code/skyrim_ui/pnpm-lock.yaml
          cache: 'pnpm'

      - name: Build the UI
        run: |
          pnpm --prefix Code/skyrim_ui/ install
          pnpm --prefix Code/skyrim_ui/ deploy:production
          cp -r Code/skyrim_ui/dist/UI ${{ env.STR_BUILD_DIR }}

      - id: output-version
        run: echo "version=$(git describe --tags)" >> $env:GITHUB_OUTPUT

      - name: Upload build files for the next job
        if: ${{ inputs.upload-build-for-next-job }}
        uses: actions/upload-artifact@v4
        with:
          name: internal-job-files
          retention-days: 1
          path: |
            ${{ env.STR_BUILD_DIR }}
            GameFiles/Skyrim/
