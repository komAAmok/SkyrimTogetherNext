name: Build windows

on:
  pull_request:
  push:
    branches:
      - main
      - prerel
  workflow_call:
    inputs:
      build-mode:
        required: true
        type: string
        default: 'releasedbg'
      upload-build-for-next-job:
        required: true
        type: boolean
        default: false
    outputs:
      str-version:
        description: "Skyrim Together version string"
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    strategy:
      matrix:
        os: [windows-2022]
        arch: [x64]

    runs-on: ${{ matrix.os }}
    if: "!contains(github.event.head_commit.message, 'ci skip')"

    outputs:
      version: ${{ steps.output-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          # We need full history in order to create a version string (BuildInfo.h)
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive --depth=1

      - name: Verify GitHub-hosted runner
        shell: pwsh
        run: |
          Write-Host "Runner name: $env:RUNNER_NAME"
          Write-Host "Runner environment: ${{ runner.environment }}"
          if ("${{ runner.environment }}" -ne "github-hosted") {
            Write-Error "Self-hosted runner detected. Please use the GitHub-hosted windows-latest runner."
          }

      - name: Checkout main on tag push
        if: github.ref_type == 'tag'
        # Checkout only if the tag was pushed to main; repos without a main
        # branch build the tagged commit directly
        run: |
          git rev-parse --verify --quiet origin/main
          if ($LASTEXITCODE -eq 0) {
            (git rev-parse HEAD) -eq (git rev-parse origin/main) -and (git checkout main)
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            Write-Output "origin/main not found; building the tagged commit as-is"
            exit 0
          }

      - name: Cache xmake dependencies
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake/packages
          key: ${{ runner.os }}-xmake-${{ hashFiles('**/xmake.lua') }}

      # Install xmake
      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 2.9.8
          actions-cache-folder: '.xmake-cache' # This doesn't cache dependencies, only xmake itself
          actions-cache-key: ${{ matrix.os }}

      - name: Update xmake repository
        run: xmake repo --update

      - name: Dump tiltedcore package definition
        shell: pwsh
        run: |
          $repo = "$env:LOCALAPPDATA\.xmake\repositories\xmake-repo"
          $pkg = Join-Path $repo "packages\t\tiltedcore\xmake.lua"
          Write-Host "=== tiltedcore package: $pkg ==="
          Get-Content $pkg

      - name: Patch tiltedcore package to pin mimalloc 2.2.4
        shell: pwsh
        run: |
          $pkg = "$env:LOCALAPPDATA\.xmake\repositories\xmake-repo\packages\t\tiltedcore\xmake.lua"
          if (-not (Test-Path $pkg)) { Write-Error "tiltedcore package file not found: $pkg" }
          $before = Get-Content $pkg -Raw
          $c = [regex]::Replace($before, 'add_deps\s*\(\s*["'']mimalloc[^)]*\)', 'add_deps("mimalloc 2.2.4")')
          $c = [regex]::Replace($c, 'add_requires\s*\(\s*["'']mimalloc[^)]*\)', 'add_requires("mimalloc 2.2.4")')
          if ($c -eq $before) {
            Write-Host "WARNING: no add_deps/add_requires mimalloc found in tiltedcore package. Full content:"
            Get-Content $pkg
            Write-Error "tiltedcore package does not declare mimalloc via add_deps/add_requires - need manual inspection"
          }
          [System.IO.File]::WriteAllText($pkg, $c, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "=== patched tiltedcore package ==="
          Get-Content $pkg

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Point xmake to Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -property installationPath
            Write-Host "Visual Studio found: $vsPath"
            xmake g --vs="$vsPath"
          } else {
            Write-Error "vswhere.exe not found - Visual Studio is not installed on this runner"
          }

      - name: Configure xmake and install dependencies (first pass)
        continue-on-error: true
        run: xmake config --arch=${{ matrix.arch }} --mode=${{ inputs.build-mode }} --toolchain=msvc --yes -vD

      - name: Dump tiltedcore source after install attempt
        if: always()
        shell: pwsh
        run: |
          $src = Get-ChildItem "$env:LOCALAPPDATA\.xmake\cache\packages" -Recurse -Directory -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match 'tiltedcore' } |
                 Select-Object -First 1
          if ($src) {
            Get-ChildItem $src.FullName -Recurse -Filter "xmake.lua" | ForEach-Object {
              Write-Host "=== $($_.FullName) ==="
              Get-Content $_.FullName
            }
          } else {
            Write-Host "(tiltedcore source not found in cache)"
          }

      - name: Patch tiltedcore source mi_malloc_size -> mi_usable_size
        shell: pwsh
        run: |
          $src = Get-ChildItem "$env:LOCALAPPDATA\.xmake\cache\packages" -Recurse -Directory -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match 'tiltedcore' } |
                 Select-Object -First 1
          if (-not $src) {
            Write-Error "tiltedcore source not found in cache"
          }
          Write-Host "Patching tiltedcore source: $($src.FullName)"
          Get-ChildItem $src.FullName -Recurse -Include "*.cpp","*.h","*.hpp" | ForEach-Object {
            $f = $_.FullName
            $c = Get-Content $f -Raw
            if ($c -match 'mi_malloc_size') {
              $c = $c -replace 'mi_malloc_size', 'mi_usable_size'
              [System.IO.File]::WriteAllText($f, $c, (New-Object System.Text.UTF8Encoding($false)))
              Write-Host "Patched $f : mi_malloc_size -> mi_usable_size"
            }
          }

      - name: Configure xmake and install dependencies (second pass)
        run: xmake config --arch=${{ matrix.arch }} --mode=${{ inputs.build-mode }} --toolchain=msvc --yes -vD


      # Build the client
      - name: Build with xmake
        run: |
          xmake -y
          echo "STR_BUILD_DIR=build/windows/${{ matrix.arch }}/${{ inputs.build-mode }}/" >> $env:GITHUB_ENV

      # Create distrib
      - name: Output distrib binaries via xmake
        run: |
          xmake install -o distrib
          cp -Force -Recurse distrib/bin/* ${{ env.STR_BUILD_DIR }}

      # Building the Together UI

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/iron
          cache-dependency-path: Code/skyrim_ui/pnpm-lock.yaml
          cache: 'pnpm'

      - name: Build the UI
        run: |
          pnpm --prefix Code/skyrim_ui/ install
          pnpm --prefix Code/skyrim_ui/ deploy:production
          cp -r Code/skyrim_ui/dist/UI ${{ env.STR_BUILD_DIR }}

      - id: output-version
        run: echo "version=$(git describe --tags)" >> $env:GITHUB_OUTPUT

      - name: Upload build files for the next job
        if: ${{ inputs.upload-build-for-next-job }}
        uses: actions/upload-artifact@v4
        with:
          name: internal-job-files
          retention-days: 1
          path: |
            ${{ env.STR_BUILD_DIR }}
            GameFiles/Skyrim/
