; STR Plugin Messaging API - companion plugin transport.
;
; This file is owned by Skyrim Together Next, not by the STRPluginMessagingAPI
; repository it describes. It overrides the copy inside that project at package
; time (see Code/plugins/plugins.json), because the upstream copy cannot be
; changed from here: the plugin repositories are pinned submodules and are not
; pushed to by this project.
;
; In this framework the file is only a fallback. SkyrimTogetherRuntime.dll
; exports the same entry points as the STRPM facade and answers them with a
; transport that rides the framework's own session, so a plugin that queries the
; framework directly needs none of this.
;
; It still matters for a plugin that loads STRPluginMessagingAPI.dll by name
; first: the facade then picks its transport here, and this is where the choice
; between the framework and the standalone bridge is made.

[Network]
; Runtime master switch.
Enabled=1

; Legacy UDP settings below are ignored by the default private STR-only build.
; They only matter if the DLL is rebuilt with STRPM_ENABLE_UDP_BACKEND=ON.
LocalPort=27990
AutoDiscovery=1

; 1 = report "target not found" until at least one peer is known/configured.
; This avoids silent false positives in remote/no-port tests where LAN
; broadcast cannot reach the other player.
RequireKnownPeer=1

RelayMode=0
DiscoveryIntervalMs=1500
PeerTimeoutMs=15000

RemotePeer1=
RemotePeer2=
RemotePeer3=
RemotePeer4=

[Transport]
; Auto = load whichever transport module is present, preferring the one named
; below.
;
; Inside Skyrim Together Next STRBridgeModule names the framework runtime, so a
; payload travels as a real framework message. Pointing it at
; STRPluginMessagingBridge.dll switches back to the standalone chat-tunnel
; bridge, which exists for sessions hosted by an unmodified Skyrim Together
; Reborn server: such a server has no plugin channel of its own and can only
; carry bytes inside chat.
Mode=Auto

; Only the file name is needed. The loader tries the given path, then the bare
; module name, then the game root, then Data\SkyrimTogetherReborn\.
STRBridgeModule=SkyrimTogetherRuntime.dll

[Identity]
DisplayName=

[Security]
SharedSecret=